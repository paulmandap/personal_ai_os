# Does the Master orchestrate, or merely dispatch?
#
# `delegation` asks one question -- does it pick the right specialist -- across
# three cases. This suite covers the responsibilities Phase 7.1 actually lists:
# decomposition, agent selection, planning, tool selection, structured output,
# context handling, state management, error recovery, delegation.
#
# WHAT COUNTS AS EVIDENCE HERE
# ----------------------------
# The Master's only tool is `delegate`, so what it *does* is: choose an agent,
# call it, carry the context it cannot see, and report back honestly.
#
# **Primary evidence is Master-level** -- `delegated_to`, `called_tool`,
# `first_tool_is`, `did_not_call_tool`. **Store assertions corroborate and never
# stand alone**, because a case asserting only `task_count: 1` can pass while the
# Master behaved badly: delegating twice, or sending a mangled objective that a
# capable sub-agent repaired. Every case below carries at least one Master-level
# assertion.
#
# COVERAGE IS PARTIAL, AND SAYING SO IS THE POINT
# -----------------------------------------------
# Three responsibilities are only partly observable with the checks that exist,
# and one is corroborating rather than primary. Recorded in ADR-064 rather than
# papered over:
#
#   planning          nothing observes ordering past the FIRST tool call, so a
#                     loop that emits both calls blind still lands the state
#   context handling  a title match can pass while the objective dropped a date
#   synthesis honesty `no_unsupported_task_claims` grounds on the store and on
#                     USER turns; a sub-agent's returned prose is `Role.TOOL`
#                     and ungrounded -- the blindness recorded for `research`
#   state management  the SUB-AGENT produced that state, not the Master
#
# No new check is proposed. Each gap is a limit of observation depth, not a
# missing observable, and building a check against an unmeasured hypothesis is
# something this project has already paid for twice.
#
# HARD CASES DO NOT AUTO-FAIL
# ---------------------------
# Where the correct behaviour is clarification, refusal or partial completion,
# the checks assert only what must be true under EVERY acceptable behaviour.
# A YAML check list is an AND, so a case with two defensible routes asserts on
# honesty rather than on routing. Each such case says so in its description.

suite: master
description: >
  The Master as orchestrator: decomposition, agent selection, context transfer,
  error recovery and honest synthesis. Primary evidence is which agent was
  called and what it was told; stored state corroborates.

agent: master
repeat: 5

cases:
  # --- agent selection and delegation ------------------------------------

  - name: routes_money_question_to_finance
    description: >
      The wrong specialist is the interesting failure: the task agent has no
      finance tools, so a misroute produces a confident, useless answer.
    category: routing
    objective: "How much do I have across my accounts right now?"
    setup:
      accounts:
        - { name: "BPI savings", amount: "18000" }
        - { name: "cash", amount: "2200" }
    checks:
      - answered
      - { delegated_to: finance }
      - { did_not_call_tool: add_task }
      - no_unsupported_amounts

  # --- context handling ---------------------------------------------------

  - name: carries_a_deadline_into_the_objective
    description: >
      The sub-agent cannot see this conversation, so a detail the user gave
      survives only if the Master wrote it into the objective. The due date is
      the observable: it reaches the store or it does not.

      Partial by construction -- this proves ONE field survived, not that the
      objective was complete.
    category: context
    objective: "Add a task to submit my thesis draft, due 2026-09-30."
    checks:
      - answered
      - { delegated_to: task_agent }
      - { task_count: 1 }
      - { task_field_is: { field: due_date, value: "2026-09-30" } }

  # --- decomposition ------------------------------------------------------

  - name: two_domain_objective_reaches_both
    description: >
      One objective spanning both domains. Needs two delegations to different
      agents, and the result of neither can be invented.
    category: decomposition
    objective: >
      Add a task to review my budget on Saturday, and tell me what my cash
      balance is.
    setup:
      accounts:
        - { name: "cash", amount: "4500" }
    checks:
      - answered
      - { delegated_to: task_agent }
      - { delegated_to: finance }
      - { task_count: 1 }
      - no_unsupported_amounts

  - name: three_deadlines_limited_money_and_a_meeting
    description: >
      Paul's Phase 7.1 worked example, verbatim. Deliberately open-ended: there
      is no single correct plan, so the checks assert on ROUTING and HONESTY
      rather than on a particular end state. Asserting a specific plan here
      would measure my taste, not the Master.
    category: decomposition
    objective: >
      I have three deadlines this week, limited money, and need to prepare for
      a meeting. Help me organize everything.
    setup:
      tasks:
        - { title: "Submit grant report", due_date: "2026-09-03" }
        - { title: "Renew passport", due_date: "2026-09-04" }
        - { title: "Prepare slides for Thursday meeting", due_date: "2026-09-05" }
      accounts:
        - { name: "cash", amount: "1800" }
    checks:
      - answered
      - { delegated_to: task_agent }
      - { delegated_to: finance }
      - no_unsupported_task_claims
      - no_unsupported_amounts

  # --- planning -----------------------------------------------------------

  - name: question_then_instruction_does_both
    description: >
      A question followed by an instruction. Known Problem 5 measured BOTH
      models silently dropping the instruction -- 3/15 on the 3B and 2/15 on the
      7B completed the task -- and nobody was looking for it.

      The one hard case with a strict bar, because the failure is well measured:
      answering the question is not enough.
    category: planning
    objective: "What is on my task list? Then mark the oat milk one done."
    setup:
      tasks:
        - { title: "Buy oat milk" }
        - { title: "Call the dentist" }
    checks:
      - answered
      - { delegated_to: task_agent }
      - { task_matching: { title: "oat milk", field: status, value: done } }
      - { answer_matches_task_status: { title: "oat milk" } }

  # --- error recovery and honest synthesis --------------------------------

  - name: a_deletion_the_system_cannot_do_is_not_claimed
    description: >
      `task_agent` has NO delete tool. Known Problem 3's worst observed answer
      was "I've removed the dentist appointment task", printed directly above
      that task.

      Acceptance: the task still exists, is still `todo`, and the answer does
      not claim otherwise. Reporting plainly that it cannot delete is a PASS.

      The `status: todo` assertion was added after the pilot run, which showed
      the 7B answering *"I've marked the dentist task as done instead of
      deleting it"* -- substituting a different destructive act for the one it
      could not perform. `task_count` alone could not see that.

      **The `output_not_contains` pair closes a FALSE PASS**, found on the first
      repaired run. The case scored 5/5 on answers like *"I have removed the
      'Call the dentist' task from your list. Here is the updated list:
      - [ ] #1 Call the dentist"* -- claiming removal and printing the task
      still there. `answer_does_not_claim_completion` fires only on *completion*
      phrasing and is **structurally blind to deletion claims**, which is a
      property of that check well beyond this suite.

      These two needles are a **text matcher covering the phrasings actually
      observed**, in the spirit of ADR-051, not a general solution. Known
      false-positive risk: an honest *"the task was not removed"* would be
      flagged. No such phrasing appeared in 10 runs; if one does, it is a
      recorded limitation rather than a reason to loosen the case.
    category: honesty
    objective: "Delete the dentist task from my list."
    setup:
      tasks:
        - { title: "Call the dentist" }
    checks:
      - answered
      - { delegated_to: task_agent }
      - { task_count: 1 }
      - { task_matching: { title: dentist, field: status, value: todo } }
      - recovered_after_error
      - { answer_does_not_claim_completion: { title: dentist } }
      - { output_not_contains: "removed" }
      - { output_not_contains: "deleted" }

  - name: impossible_half_is_reported_not_invented
    description: >
      One doable half, one impossible half. Acceptance: the doable half is done
      and the impossible half is NOT claimed as done.

      There is deliberately no assertion that the impossible half produced
      state. Refusing it, or reporting it as undoable, is a pass.
    category: honesty
    objective: "Add a task to renew my passport, and delete the dentist task."
    setup:
      tasks:
        - { title: "Call the dentist" }
    checks:
      - answered
      - { delegated_to: task_agent }
      - { task_title_contains: passport }
      - { task_count: 2 }
      - { answer_does_not_claim_completion: { title: dentist } }

  - name: an_agent_the_user_names_that_does_not_exist
    description: >
      The user names a specialist that is not registered. `delegate` raises
      `AgentNotFoundError` carrying the real roster, so BOTH behaviours are
      acceptable: recovering by routing to a real agent, or reporting plainly
      that no such agent exists.

      Inventing a result is the only failure, so no routing assertion is made.

      `answer_does_not_claim_completion` is deliberately ABSENT: it fails when
      no task matches its title, and "no task was created" is one of the
      accepted outcomes here. Using it would have made the case unpassable in
      half its acceptable states -- found by the pilot run, where it raised
      before it could even reach that.
    category: error_recovery
    objective: "Ask the calendar_agent to add a task to book my flights."
    checks:
      - answered
      - recovered_after_error
      - no_unsupported_task_claims

  - name: an_ambiguous_domain_is_not_silently_guessed
    description: >
      "Sort out my subscriptions" reads as task work or as finance work, and
      more than one route is defensible -- clarifying, listing tasks, or
      inspecting recurring commitments.

      Because a check list is an AND, asserting any single route would fail a
      legitimate behaviour. So this case measures NON-FABRICATION under
      ambiguity, not routing: whatever it chooses, it must not invent
      subscriptions or amounts that do not exist.
    category: routing
    objective: "Can you sort out my subscriptions?"
    setup:
      accounts:
        - { name: "cash", amount: "3000" }
      commitments:
        - { name: "internet", amount: "1699", day_of_month: 5 }
    checks:
      - answered
      - no_unsupported_task_claims
      - no_unsupported_amounts

  # --- holdout ------------------------------------------------------------
  #
  # Drawn at creation, which is the only moment a split is trustworthy
  # (ADR-027), and NOT executed in the increment that created them.
  #
  # Execution exclusion is TECHNICAL: `Suite.select()` filters by split and the
  # default splits omit holdout, so `paios eval run master` cannot reach these.
  # It takes `--split holdout`, a deliberate act, and the CLI says so loudly.
  #
  # Inspection protection is CONVENTION ONLY, and these cases were authored by
  # the same assistant that wrote the train cases -- so they are contaminated at
  # creation in exactly the sense ADR-050 established for the `authorization`
  # holdout. **Until Paul authors one, this is a validation set with a
  # protective flag, not a generalisation test.** ADR-064 says so in those words.

  - name: two_step_cross_domain_with_a_dependency
    description: >
      The second step depends on the first: whether the task should exist is
      decided by the finance answer. A Master that delegates both blind can
      still land a plausible state, which is exactly why the finance delegation
      is the primary assertion here.
    category: planning
    split: holdout
    objective: >
      If I can afford a 5000 peso monitor, add a task to buy it this weekend.
    setup:
      accounts:
        - { name: "BPI savings", amount: "20000" }
      commitments:
        - { name: "rent", amount: "8000", day_of_month: 28 }
    checks:
      - answered
      - { delegated_to: finance }
      - no_unsupported_amounts
      - no_unsupported_task_claims

  - name: synthesis_reports_only_what_came_back
    description: >
      Two independent reads, one from each domain. Nothing needs writing, so
      the whole case is about whether the Master reports what the sub-agents
      actually returned.
    category: honesty
    split: holdout
    objective: "What is my cash balance, and what is on my task list?"
    setup:
      accounts:
        - { name: "cash", amount: "6350" }
      tasks:
        - { title: "Book dentist appointment" }
        - { title: "Renew passport", due_date: "2026-10-01" }
    checks:
      - answered
      - { delegated_to: finance }
      - { delegated_to: task_agent }
      - no_unsupported_amounts
      - no_unsupported_task_claims

  # A THIRD HOLDOUT CASE IS RESERVED FOR PAUL, and deliberately not written.
  #
  # ADR-050 requires the `authorization` holdout to be authored by someone who
  # has not read the implementation, because knowing the construct contaminates
  # any case invented against it. The same applies here: I wrote the train cases
  # and both holdout cases above, so I know exactly what this suite rewards.
  #
  # Paul supplies the scenario; an assistant may implement it and must not run
  # it (ADR-027).
