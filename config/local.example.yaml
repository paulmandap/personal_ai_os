# Copy to config/local.yaml (gitignored) and edit for this machine.
#
# Only include keys you actually want to override -- this file is deep-merged
# over config/default.yaml, so anything omitted keeps its shared default.

# Point at a different Ollama host, or give slow models more time.
# models:
#   ollama:
#     base_url: "http://localhost:11434"
#     request_timeout_s: 300

# Remap the ladder without touching code. If you pull a 14B and accept the
# CPU spill, this is the only edit required to start using it.
# models:
#   tiers:
#     medium:
#       model: "qwen2.5:7b-instruct"
#     large:
#       model: "qwen2.5:14b-instruct-q4_K_M"

# Unattended runs: never block on a stdin prompt.
# permissions:
#   interactive: false

# Widen the filesystem jail. Be deliberate here -- this is the boundary that
# keeps an agent inside the project.
# paths:
#   allowed_roots:
#     - "."
#     - "C:/paul/notes"

# observability:
#   log_level: DEBUG
