[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-os"
version = "0.1.0"
description = "A local-first, model-agnostic personal agent platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Paul Christian Mandap" }]

# Three runtime dependencies, deliberately.
#   pydantic - types, config validation, tool schemas, structured output
#   httpx    - HTTP client for local inference servers
#   pyyaml   - agent manifests and configuration
#
# NOTE: no `anthropic`, `openai`, `langchain`, `llamaindex`, `crewai` or
# `autogen` may be added here. The runtime is local-first (see docs/decisions.md
# ADR-001); there is deliberately no cloud code path to fall back to.
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
paios = "personal_ai_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `evaluations` is here for one reason: the mechanism detector's controls.
# A detector is only worth its number if it has been shown to fire when it
# should and stay silent when it should not, and a check that lives outside the
# default test run is a check that rots. Nothing else under `evaluations/` is
# collectable -- it is YAML and JSON.
testpaths = ["tests", "evaluations"]
markers = [
    "integration: needs a running Ollama server and pulled models",
]
# Unit tests are the default: `pytest` must pass with Ollama stopped.
# Run the live ones explicitly with `pytest -m integration`.
addopts = "-m 'not integration'"
